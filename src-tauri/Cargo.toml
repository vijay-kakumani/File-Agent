[package]
name = "local-ai-document-agent"
version = "1.0.0"
description = "Local AI Document Agent Windows Desktop Application"
authors = ["Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.1.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
